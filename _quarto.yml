project:
  type: website
  output-dir: _site

website:
  title: "Phantoms Hockey Hub"
  site-url: "https://www.phantomshockey.org/"
  navbar:
    pinned: true
    background: "#151B24"
    foreground: "#FFFFFF"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Schedule"
        href: index.qmd#schedule
      - text: "Standings"
        href: index.qmd#schedule
      - text: "Contact"
        href: index.qmd#contact
  page-footer:
    background: "#151B24"
    foreground: "#FFFFFF"
    left: "© 2026 Phantoms Hockey Hub"
    right: "Built with Quarto"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    page-layout: full
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="description" content="Official hub for Phantoms dek hockey schedules, standings, statistics, announcements, and team updates.">
