project:
  type: website
  output-dir: .
  render:
    - "*.qmd"
  resources:
    - CNAME
    - logos/
    - robots.txt
    - llms.txt
    - llms-full.txt

website:
  title: "Phantoms Hockey Hub"
  site-url: "https://phantomshockey.org/"
  description: "Team hub for Phantoms hockey schedules, standings, announcements, contact information, and season notes."
  favicon: logos/phantoms-logo.jpg
  image: logos/phantoms-banner.jpg
  page-navigation: true
  search:
    location: navbar
    type: overlay
  navbar:
    pinned: true
    logo: logos/phantoms-logo.jpg
    logo-alt: "Phantoms logo"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Team Center"
        href: team.qmd
      - text: "Season"
        href: season.qmd
      - text: "Learning"
        href: learning.qmd
      - text: "About"
        href: about.qmd
      - text: "Contact"
        href: contact.qmd
  sidebar:
    - title: "Team Center"
      style: docked
      contents:
        - team.qmd
        - season.qmd
        - learning.qmd
        - about.qmd
        - contact.qmd
  page-footer:
    left: "(c) 2026 Phantoms Hockey Hub"
    center:
      - text: "Team Center"
        href: team.qmd
      - text: "Learning"
        href: learning.qmd
      - text: "Contact"
        href: contact.qmd
    right: "Built with Quarto"

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-location: right
    page-layout: article
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="robots" content="index, follow">
        <meta property="og:site_name" content="Phantoms Hockey Hub">
        <meta property="og:type" content="website">
        <meta property="og:image" content="https://phantomshockey.org/logos/phantoms-banner.jpg">
        <meta name="twitter:card" content="summary_large_image">
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "WebSite",
              "@id": "https://phantomshockey.org/#website",
              "url": "https://phantomshockey.org/",
              "name": "Phantoms Hockey Hub",
              "description": "Team hub for Phantoms hockey schedules, standings, announcements, contact information, and season notes.",
              "inLanguage": "en-US",
              "publisher": {
                "@id": "https://phantomshockey.org/#organization"
              }
            },
            {
              "@type": ["SportsTeam", "Organization"],
              "@id": "https://phantomshockey.org/#organization",
              "name": "Phantoms",
              "url": "https://phantomshockey.org/",
              "sport": "Ice hockey",
              "logo": "https://phantomshockey.org/logos/phantoms-logo.jpg",
              "image": "https://phantomshockey.org/logos/phantoms-banner.jpg",
              "email": "admin@phantomshockey.org"
            }
          ]
        }
        </script>
