<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting – Phantoms Hockey Hub</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      var path = window.location.pathname;
      var search = window.location.search || "";
      var hash = window.location.hash || "";

      // GitHub Pages receives /team.html/#/ as /team.html/ because the hash
      // stays in the browser. Remove the invalid slash and preserve #/.
      if (/\.html\/$/.test(path)) {
        window.location.replace(path.replace(/\/$/, "") + search + hash);
        return;
      }

      // Keep users on the site if they hit a stale or unknown page.
      window.location.replace("/" + hash);
    }());
  </script>
  <style>
    :root {
      --phantoms-charcoal: #151B24;
      --phantoms-gold: #F2B400;
      --phantoms-white: #FFFFFF;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--phantoms-white);
      background: var(--phantoms-charcoal);
      text-align: center;
    }

    main {
      max-width: 36rem;
      padding: 2rem;
    }

    a {
      color: var(--phantoms-gold);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Redirecting...</h1>
    <p>If you are not redirected automatically, <a href="/">return to the Phantoms Hockey Hub home page</a>.</p>
  </main>
</body>
</html>
